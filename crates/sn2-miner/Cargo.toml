[package]
name = "sn2-miner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "sn2-miner"
path = "src/main.rs"

[dependencies]
sn2-types = { workspace = true }
sn2-chain = { workspace = true }
sn2-circuit-store = { workspace = true }
btlightning = { workspace = true }
dsperse = { workspace = true }
jstprove_circuits = { git = "https://github.com/inference-labs-inc/JSTprove.git", rev = "87a1859f3487cf0fb9a463dbfd713b1df4827afc" }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }
subxt = { workspace = true }
shellexpand = { workspace = true }
rmp-serde = { workspace = true }
parity-scale-codec = { version = "3", features = ["derive"] }
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true }
ctor = { workspace = true }

[dev-dependencies]
tempfile = "3"
